<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing table</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="heading-text">
        <h1>Our Pricing</h1>
        <p>Choose a plan that works best for you.</p>
    </div>

    <div class="section">
        <div class="card card1">
            <h2>Basic</h2>
            <div>$10/mo</div>
            <p class="p2">✔ 1 Project</p>
            <p class="p1">✔ Basic Support</p>
            <p class="p2">✔ Community Access </p>
            <button class="cta">Select</button>
        </div>
        <div class="card card2">
            <h2>Standard</h2>
            <div>$20/mo</div>
            <p class="p2">✔ 5 Project</p>
            <p class="p1">✔ Priority Support</p>
            <p class="p2">✔ Community Access </p>
            <button class="cta">Select</button>
        </div>
        <div class="card card3">
            <h2>Premium</h2>
            <div>$50/mo</div>
            <p class="p2">✔ Unlimited Projects</p>
            <p class="p1">✔ 24/7 Support</p>
            <p class="p2">✔ Community Access </p>
            <button class="cta">Select</button>
        </div>
    </div>
</body>
</html>
